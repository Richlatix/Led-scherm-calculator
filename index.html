<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Pixelmap Pro</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-dark: #1e1e1e; --bg-panel: #2d2d2d; --accent: #007acc; --text: #ffffff; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: var(--bg-dark); color: var(--text); display: flex; overflow: hidden; }
    
    /* Layout */
    #sidebar { width: 350px; background-color: var(--bg-panel); padding: 15px; overflow-y: auto; }
    #workspace { flex: 1; position: relative; overflow: auto; background-color: #000; }
    
    /* Canvas */
    #canvas-workspace { position: relative; transform-origin: top left; transition: transform 0.2s; background-color: #000; }
    .led-wall { position: absolute; display: grid; border: 3px solid #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
    .led-panel { border: 1px solid #444; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666; }
    
    /* Inputs/Buttons */
    input, select { width: 100%; padding: 6px; margin-bottom: 5px; background: #1e1e1e; border: 1px solid #444; color: white; border-radius: 4px; }
    button { width: 100%; padding: 8px; background: var(--accent); color: white; border: none; cursor: pointer; margin-top: 5px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Pixelmap Pro</h2>
    
    <details open>
      <summary>Canvas Instellingen</summary>
      <label>Breedte (px)</label><input type="number" id="canvasW" value="3840">
      <label>Hoogte (px)</label><input type="number" id="canvasH" value="2160">
      <button onclick="applyCanvasSettings()">Pas Resolutie Toe</button>
      <button onclick="exportToPng()" style="background:#28a745;">Exporteer als PNG</button>
    </details>

    <details open>
      <summary>Scherm Bouwen</summary>
      <select id="panelType"><option>Laden...</option></select>
      <div style="display:flex; gap:5px;">
        <input type="number" id="cols" value="4" placeholder="B">
        <input type="number" id="rows" value="3" placeholder="H">
      </div>
      <div style="display:flex; gap:5px;">
        <input type="number" id="posX" value="500" placeholder="X">
        <input type="number" id="posY" value="500" placeholder="Y">
      </div>
      <button id="addWallBtn">Plaats Scherm</button>
    </details>
  </div>

  <div id="workspace">
    <div id="canvas-workspace"></div>
    <div style="position:fixed; bottom:20px; right:20px; background:#2d2d2d; padding:10px;">
      Zoom: <input type="range" id="zoom" min="0.1" max="1" step="0.1" value="0.2">
    </div>
  </div>

  <script>
    (function() {
      const db = window.supabase.createClient('https://gjpoebdsyvqtxyazwmxp.supabase.co', 'sb_publishable_PEUhiXzgdLhaaGdnsipBQQ_snAHkGfD');
      let panelDb = {}, walls = [];

      window.applyCanvasSettings = function() {
        const cw = document.getElementById('canvasW').value;
        const ch = document.getElementById('canvasH').value;
        const c = document.getElementById('canvas-workspace');
        c.style.width = cw + 'px';
        c.style.height = ch + 'px';
      };

      // Exporteer functie
      window.exportToPng = async function() {
        const width = parseInt(document.getElementById('canvasW').value);
        const height = parseInt(document.getElementById('canvasH').value);
        
        // Maak een tijdelijk canvas voor de export
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        // Vul achtergrond zwart
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        // Teken muren op het export canvas
        walls.forEach(w => {
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 5;
            ctx.strokeRect(w.x, w.y, w.cols * w.panel.pixelWidth, w.rows * w.panel.pixelHeight);
            ctx.fillStyle = '#111';
            ctx.fillRect(w.x, w.y, w.cols * w.panel.pixelWidth, w.rows * w.panel.pixelHeight);
        });

        // Download
        const link = document.createElement('a');
        link.download = 'pixelmap-export.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };

      // --- De rest van je logica (loadDatabase, addWall, etc) blijft hetzelfde ---
      // (Heb ik hier ingekort voor de leesbaarheid, maar combineer met je bestaande code)
      
      applyCanvasSettings();
      document.getElementById('addWallBtn').addEventListener('click', () => {
        // ... (je addWall logica)
      });
    })();
  </script>
</body>
</html>
