<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Pixelmap & CAD - Team Editie</title>
  
  <!-- Supabase inladen via CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-dark: #1e1e1e; --bg-panel: #2d2d2d; --accent: #007acc;
      --text: #ffffff; --canvas-bg: #121212; --grid-line: #333333; --border: #444;
    }
    body, html {
      margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--bg-dark); color: var(--text); display: flex; overflow: hidden;
    }

    /* --- LOGIN SCHERM --- */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.9); z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--bg-panel); padding: 30px; border-radius: 8px; text-align: center; border: 1px solid var(--accent);
    }
    .login-box input {
      font-size: 24px; text-align: center; letter-spacing: 5px; width: 150px; padding: 10px; margin: 10px 0;
      background-color: #1e1e1e; border: 1px solid var(--border); color: white; border-radius: 4px;
    }

    /* --- ZIJBALK & UI --- */
    #sidebar {
      width: 350px; background-color: var(--bg-panel); padding: 15px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.5); z-index: 10; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    details { background-color: #252525; border: 1px solid var(--border); border-radius: 4px; padding: 10px; }
    summary { font-weight: bold; cursor: pointer; outline: none; margin: -10px; padding: 10px; }
    details[open] summary { border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-row { display: flex; gap: 10px; }
    label { display: block; margin-bottom: 4px; font-size: 12px; color: #aaa; }
    input, select { width: 100%; padding: 6px; background-color: #1e1e1e; border: 1px solid var(--border); color: white; border-radius: 4px; box-sizing: border-box; }
    
    button { width: 100%; padding: 8px; background-color: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    button:hover { background-color: #005f9e; }
    button.success { background-color: #28a745; }
    button.success:hover { background-color: #218838; }

    #wallList { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
    .wall-item { background: #1e1e1e; border: 1px solid var(--border); padding: 8px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; font-size: 13px; }
    .wall-item button { width: auto; padding: 4px 8px; margin: 0; background-color: #cc3300; }

    /* --- WORKSPACE --- */
    #workspace { flex: 1; position: relative; overflow: auto; background-color: #000; }
    #zoom-controls { position: absolute; bottom: 20px; right: 20px; background: var(--bg-panel); padding: 10px; border-radius: 4px; z-index: 10; display: flex; align-items: center; gap: 10px;}
    
    #canvas-workspace {
      width: 7680px; height: 4320px; background-color: var(--canvas-bg);
      background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 100px 100px; position: relative; transform-origin: top left; transform: scale(0.15); transition: transform 0.2s;
    }
    .led-wall { position: absolute; display: grid; border: 3px solid #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
    .led-panel { box-sizing: border-box; border: 1px solid #444; background-color: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; text-align: center; }
  </style>
</head>
<body>

  <!-- LOGIN SCHERM -->
  <div id="login-overlay">
    <div class="login-box">
      <h2>Team Access</h2>
      <p>Voer je pincode in om de bibliotheek te laden.</p>
      <input type="password" id="pinInput" maxlength="3">
      <button onclick="checkPin()">Inloggen</button>
      <p id="loginError" style="color: red; display: none;">Foute code!</p>
    </div>
  </div>

  <div id="sidebar">
    <h2 style="margin: 0;">Pixelmap Pro</h2>
    <p id="db-status" style="margin: 0 0 10px 0; font-size: 11px; color: #aaa;">Database: Wachten op login...</p>

    <!-- Project Bestand Beheer -->
    <details open>
      <summary>Project Opslaan / Openen</summary>
      <div class="form-row">
        <button onclick="exportProject()" class="success">Opslaan (.json)</button>
        <button onclick="document.getElementById('importFile').click()" style="background-color: #555;">Openen</button>
        <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importProject(event)">
      </div>
    </details>

    <details open>
      <summary>Scherm Bouwen</summary>
      <div class="form-group">
        <label>Selecteer Paneel (Uit Database)</label>
        <select id="panelType">
          <option value="">Laden...</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Kolommen</label><input type="number" id="cols" value="4"></div>
        <div class="form-group"><label>Rijen</label><input type="number" id="rows" value="3"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>X Positie</label><input type="number" id="posX" value="500"></div>
        <div class="form-group"><label>Y Positie</label><input type="number" id="posY" value="500"></div>
      </div>
      <button onclick="addWall()">Plaats Scherm</button>
    </details>

    <details open>
      <summary>Project Overzicht</summary>
      <p id="totalPixels" style="color: #00ffcc; font-size: 16px; font-weight: bold; margin: 5px 0;">0 Pixels</p>
      <p id="totalPower" style="color: #ffaa00; font-size: 13px; margin: 0 0 10px 0;">0 Watt max</p>
      <hr style="border-color: var(--border);">
      <div id="wallList"></div>
    </details>
  </div>

  <div id="workspace">
    <div id="canvas-workspace"></div>
    <div id="zoom-controls">
      <label style="color:white; font-size: 12px; margin:0;">Zoom:</label>
      <input type="range" id="zoom" min="0.05" max="1" step="0.05" value="0.15" oninput="updateZoom(this.value)">
    </div>
  </div>

  <script>
    // --- 1. SUPABASE SETUP ---
    const SUPABASE_URL = 'https://gjpoebdsyvqtxyazwmxp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PEUhiXzgdLhaaGdnsipBQQ_snAHkGfD';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- STATE ---
    let panelDb = {}; 
    let processorDb = {};
    let walls = [];
    let wallCounter = 1;

    // --- LOGIN LOGICA ---
    function checkPin() {
      const pin = document.getElementById('pinInput').value;
      if(pin === '666') {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('db-status').innerText = "Database: Verbinden...";
        loadDatabase(); 
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    // Luister ook naar de 'Enter' toets op het wachtwoord veld
    document.getElementById("pinInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") checkPin();
    });

    // --- DATABASE INLADEN ---
    async function loadDatabase() {
      // Haal LED types op
      const { data: ledData, error: ledError } = await supabase.from('led_types').select('*');
      
      const select = document.getElementById('panelType');
      select.innerHTML = ''; 

      if (ledError || !ledData || ledData.length === 0) {
        console.error("Supabase error led_types:", ledError);
        document.getElementById('db-status').innerText = "Database: Fout bij laden LED's";
        document.getElementById('db-status').style.color = "red";
      } else {
        ledData.forEach(panel => {
          panelDb[panel.id] = { id: panel.id, name: panel.name, pixelWidth: panel.pixel_width, pixelHeight: panel.pixel_height, powerMax: panel.power_max };
          const option = document.createElement('option');
          option.value = panel.id; 
          option.innerText = `${panel.name} (${panel.pixel_width}x${panel.pixel_height})`;
          select.appendChild(option);
        });
      }

      // Haal Processors op (voor later gebruik)
      const { data: procData, error: procError } = await supabase.from('processors').select('*');
      if(procData) {
          procData.forEach(proc => {
              processorDb[proc.id] = { id: proc.id, name: proc.name, maxPixels: proc.max_pixels_per_port, totalPorts: proc.total_ports };
          });
      }

      if(!ledError) {
          document.getElementById('db-status').innerText = "Database: Verbonden (Team)";
          document.getElementById('db-status').style.color = "#00ffcc";
      }
    }

    // --- IMPORT / EXPORT LOGICA ---
    function exportProject() {
      if(walls.length === 0) return alert("Je hebt nog niks gebouwd om op te slaan!");
      
      const projectData = JSON.stringify(walls, null, 2);
      const blob = new Blob([projectData], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = "pixelmap_project.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importProject(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedWalls = JSON.parse(e.target.result);
          walls = importedWalls;
          
          // Bereken de hoogste wall id om de counter goed te zetten
          let highestId = 0;
          walls.forEach(w => {
              const num = parseInt(w.id.split(' ')[1]);
              if(num > highestId) highestId = num;
          });
          wallCounter = highestId + 1;

          renderCanvas();
          renderWallList();
        } catch (err) {
          alert("Fout bij het laden van het bestand. Is het een geldig JSON project?");
        }
      };
      reader.readAsText(file);
      event.target.value = ""; 
    }

    // --- SCHERMEN EN CANVAS LOGICA ---
    function updateZoom(scale) { document.getElementById('canvas-workspace').style.transform = `scale(${scale})`; }

    function addWall() {
      const typeId = document.getElementById('panelType').value;
      if(!typeId) return alert("Wacht tot de database is geladen!");
      
      const cols = parseInt(document.getElementById('cols').value);
      const rows = parseInt(document.getElementById('rows').value);
      const x = parseInt(document.getElementById('posX').value);
      const y = parseInt(document.getElementById('posY').value);

      walls.push({
        id: 'Scherm ' + wallCounter++,
        panel: panelDb[typeId],
        cols: cols, rows: rows, x: x, y: y
      });
      
      renderCanvas(); renderWallList();
    }

    function removeWall(index) { walls.splice(index, 1); renderCanvas(); renderWallList(); }

    function renderWallList() {
      const list = document.getElementById('wallList');
      list.innerHTML = '';
      walls.forEach((wall, index) => {
        const item = document.createElement('div');
        item.className = 'wall-item';
        item.innerHTML = `<span>${wall.id} (${wall.cols}x${wall.rows} ${wall.panel.name})</span> <button onclick="removeWall(${index})">X</button>`;
        list.appendChild(item);
      });
    }

    function renderCanvas() {
      const canvas = document.getElementById('canvas-workspace');
      canvas.innerHTML = '';
      let totalPixels = 0, totalPower = 0;

      walls.forEach((wall, wallIndex) => {
        const wallDiv = document.createElement('div');
        wallDiv.className = 'led-wall';
        wallDiv.style.gridTemplateColumns = `repeat(${wall.cols}, ${wall.panel.pixelWidth}px)`;
        wallDiv.style.gridTemplateRows = `repeat(${wall.rows}, ${wall.panel.pixelHeight}px)`;
        wallDiv.style.left = wall.x + 'px';
        wallDiv.style.top = wall.y + 'px';

        const totalPanels = wall.cols * wall.rows;
        for (let i = 0; i < totalPanels; i++) {
          const panelDiv = document.createElement('div');
          panelDiv.className = 'led-panel';
          panelDiv.innerText = `${wall.id}\nP${i+1}`;
          wallDiv.appendChild(panelDiv);
        }
        canvas.appendChild(wallDiv);
        totalPixels += totalPanels * (wall.panel.pixelWidth * wall.panel.pixelHeight);
        totalPower += totalPanels * (wall.panel.powerMax || 0);
      });

      document.getElementById('totalPixels').innerText = totalPixels.toLocaleString() + ' Pixels';
      document.getElementById('totalPower').innerText = totalPower.toLocaleString() + ' Watt max';
    }
  </script>
</body>
</html>
